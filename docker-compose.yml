# ponytail: minimal compose service for katz-todo
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: katz_todo
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    env_file:
      - path: .env
        required: false
    environment:
      - PORT=${PORT:-3000}
      - NODE_ENV=${NODE_ENV:-production}
      - DATABASE_URL=${DOCKER_DATABASE_URL:-postgres://postgres:postgres@host.docker.internal:5432/app}
      - REDIS_URL=${DOCKER_REDIS_URL:-redis://host.docker.internal:6379}
      - TELEGRAM_TOKEN=${TELEGRAM_TOKEN:-}
      - DISCORD_TOKEN=${DISCORD_TOKEN:-}
    extra_hosts:
      - "host.docker.internal:host-gateway"
